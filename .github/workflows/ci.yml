name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check (StyLua)
        run: stylua --check src tests

      - name: Lint (Selene)
        run: selene src tests

      - name: Unit tests (Lune)
        run: lune run tests/lune/run

      - name: Sourcemap (Rojo)
        run: rojo sourcemap default.project.json -o sourcemap.json

      - name: Fetch Roblox type definitions
        run: curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

      - name: Type check (luau-lsp)
        run: luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json --ignore="Packages/**" --ignore="tests/lune/**" src tests

      - name: Build place (Rojo)
        run: rojo build -o /tmp/NeonArcana.ci.rbxl
